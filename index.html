
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Funcionários</title>
</head>
<body>

    <h1>Sistema de Gestão de Funcionários</h1>

    <h2>Cadastro de Funcionários</h2>

    <form id="formFuncionario">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" required>

        <label for="idade">Idade:</label>
        <input type="number" id="idade" min="1" step="1" required>

        <label for="cargo">Cargo:</label>
        <input type="text" id="cargo" required>

        <label for="salario">Salário:</label>
        <input type="number" id="salario"
               min="0" step="0.01" required>

        <button type="button" id="btnCadastrar">
            Cadastrar
        </button>

    </form>

    <h2>Lista de Funcionários</h2>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cargo</th>
                <th>Salário</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody id="tabelaFuncionarios"></tbody>
    </table>

    <h2>Relatórios</h2>

    <button id="btnSalariosAltos">
        Salários acima de R$ 5.000
    </button>

    <button id="btnMediaSalarial">
        Média Salarial
    </button>

    <button id="btnCargos">
        Cargos Únicos
    </button>

    <button id="btnMaiusculo">
        Nomes em Maiúsculo
    </button>

    <div id="resultadoRelatorio"></div>

    <script src="script.js"></script>

</body>
</html>
